<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Focus Hub - ポモドーロ＆学習ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1'
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3 shrink-0">
                <div class="p-2 bg-brand-500 text-white rounded-xl shadow-sm">
                    <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                </div>
                <span class="font-bold text-lg hidden sm:inline-block tracking-tight text-slate-900 dark:text-white">FocusHub</span>
            </div>

            <div class="flex items-center bg-slate-100 dark:bg-slate-900 rounded-2xl px-3 py-1.5 border border-slate-200 dark:border-slate-800 shadow-inner">
                <div class="flex items-center mr-3">
                    <span id="timer-status-badge" class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 flex items-center gap-1.5 transition-colors">
                        <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="status-text">集中タイム</span>
                    </span>
                </div>

                <div id="timer-display" class="font-mono font-bold text-2xl tracking-wider text-slate-800 dark:text-slate-100 min-w-[75px] text-center">
                    25:00
                </div>

                <div class="flex items-center space-x-1 ml-3">
                    <button id="btn-toggle-timer" title="開始/一時停止" class="p-2 text-white bg-brand-500 hover:bg-brand-600 rounded-xl transition shadow-sm active:scale-95">
                        <i id="icon-toggle" data-lucide="play" class="w-4 h-4 fill-current"></i>
                    </button>
                    <button id="btn-skip-timer" title="スキップ" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition active:scale-95">
                        <i data-lucide="skip-forward" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-reset-timer" title="リセット" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition active:scale-95">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>

                <button id="btn-open-settings" title="タイマー設定" class="ml-2 pl-2 border-l border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="flex items-center space-x-3 shrink-0">
                <div class="hidden md:flex items-center space-x-4 text-xs font-medium text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800/60 px-3 py-1.5 rounded-xl border border-slate-200/60 dark:border-slate-700/60">
                    <div class="flex items-center gap-1.5" title="本日のセッション数">
                        <i data-lucide="flame" class="w-4 h-4 text-amber-500"></i>
                        <span><strong id="header-sessions" class="text-slate-800 dark:text-slate-200">0</strong> 回</span>
                    </div>
                    <div class="h-3 w-px bg-slate-300 dark:bg-slate-700"></div>
                    <div class="flex items-center gap-1.5" title="本日の集中累計時間">
                        <i data-lucide="clock" class="w-4 h-4 text-brand-500"></i>
                        <span><strong id="header-total-time" class="text-slate-800 dark:text-slate-200">0</strong> 分</span>
                    </div>
                </div>

                <button id="btn-toggle-theme" title="テーマ切り替え" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition">
                    <i id="icon-theme-sun" data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i id="icon-theme-moon" data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6">
        <div class="md:hidden grid grid-cols-2 gap-3">
            <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 flex items-center space-x-3">
                <div class="p-2 bg-amber-100 dark:bg-amber-950/50 text-amber-600 rounded-xl">
                    <i data-lucide="flame" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-500 dark:text-slate-400">完了セッション</div>
                    <div class="text-base font-bold text-slate-800 dark:text-slate-100"><span id="mobile-sessions">0</span> 回</div>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 flex items-center space-x-3">
                <div class="p-2 bg-brand-100 dark:bg-brand-950/50 text-brand-500 rounded-xl">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-500 dark:text-slate-400">総集中時間</div>
                    <div class="text-base font-bold text-slate-800 dark:text-slate-100"><span id="mobile-total-time">0</span> 分</div>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-1 border-b border-slate-200 dark:border-slate-700 pb-2">
            <button id="tab-flashcards" onclick="switchTab('flashcards')" class="tab-btn active border-b-2 border-brand-500 text-brand-500 font-semibold px-4 py-2 text-sm flex items-center space-x-2 transition">
                <i data-lucide="layers" class="w-4 h-4"></i>
                <span>暗記カード</span>
            </button>
            <button id="tab-mistakes" onclick="switchTab('mistakes')" class="tab-btn border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium px-4 py-2 text-sm flex items-center space-x-2 transition">
                <i data-lucide="notebook-pen" class="w-4 h-4"></i>
                <span>誤答ノート</span>
            </button>
            <button id="tab-ambient" onclick="switchTab('ambient')" class="tab-btn border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium px-4 py-2 text-sm flex items-center space-x-2 transition">
                <i data-lucide="headphones" class="w-4 h-4"></i>
                <span>環境音 (BGM)</span>
            </button>
        </div>

        <div id="tab-content-area" class="flex-1">
            <div id="view-flashcards" class="tab-view block space-y-6">
                <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <div class="border-b border-slate-200 dark:border-slate-700 flex items-center gap-2 p-2">
                        <button id="flashcard-study-tab" onclick="switchFlashcardPane('study')" class="flashcard-pane-tab flex-1 px-4 py-2 text-sm font-semibold rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-300 border border-brand-200 dark:border-brand-800">
                            学習
                        </button>
                        <button id="flashcard-manage-tab" onclick="switchFlashcardPane('manage')" class="flashcard-pane-tab flex-1 px-4 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-transparent">
                            管理
                        </button>
                    </div>

                    <div id="flashcard-study-panel" class="flashcard-pane block p-8">
                        <div class="text-center max-w-2xl mx-auto flex flex-col items-center justify-center min-h-[320px] transition-all">
                            <span class="text-xs font-semibold px-3 py-1 bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-300 rounded-full mb-4">単語・公式の暗記</span>

                            <h2 id="flashcard-question" class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-3"></h2>
                            <div id="flashcard-answer" class="hidden text-base text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-900/60 px-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 mb-6 max-w-lg"></div>

                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">カードをタップして裏面の解説を確認します</p>

                            <div class="flex flex-wrap justify-center gap-3">
                                <button id="btn-flashcard-toggle" class="px-6 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl font-medium text-sm transition">
                                    答えを表示する
                                </button>
                                <button id="btn-flashcard-next" class="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl font-medium text-sm transition shadow-sm">
                                    次のカード
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="flashcard-manage-panel" class="flashcard-pane hidden p-6">
                        <div class="max-w-2xl mx-auto space-y-6">
                            <form id="flashcard-form" class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 p-4 space-y-3">
                                <div class="text-left">
                                    <label for="flashcard-question-input" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">問題</label>
                                    <input id="flashcard-question-input" type="text" placeholder="例: HTML と CSS の違いは？" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500" maxlength="120">
                                </div>
                                <div class="text-left">
                                    <label for="flashcard-answer-input" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">答え</label>
                                    <textarea id="flashcard-answer-input" rows="3" placeholder="例: HTML は構造、CSS は見た目、JavaScript は動作を担当します。" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500" maxlength="250"></textarea>
                                </div>
                                <div class="flex justify-end gap-2">
                                    <button type="button" id="flashcard-cancel" class="hidden px-3 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition">
                                        キャンセル
                                    </button>
                                    <button id="flashcard-submit" type="submit" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold transition">
                                        カードを追加
                                    </button>
                                </div>
                            </form>

                            <div class="w-full">
                                <div class="mb-3 flex items-center justify-between">
                                    <h4 class="text-sm font-semibold text-slate-700 dark:text-slate-200">カード一覧</h4>
                                </div>
                                <div id="flashcard-list" class="space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="view-mistakes" class="tab-view hidden space-y-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                        <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100">弱点克服リスト</h3>
                        <form id="mistake-form" class="flex w-full sm:w-auto gap-2">
                            <input id="mistake-input" type="text" placeholder="例: SQL JOIN の違い" class="w-full sm:w-72 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500" maxlength="80">
                            <button type="submit" class="px-3 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-xs font-semibold flex items-center gap-1 transition whitespace-nowrap">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                追加
                            </button>
                        </form>
                    </div>
                    <div id="mistake-list" class="divide-y divide-slate-100 dark:divide-slate-700/50"></div>
                </div>
            </div>

            <div id="view-ambient" class="tab-view hidden space-y-6">
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <p class="text-xs uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Ambient</p>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">集中を助ける環境音</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="ambient-card bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <i data-lucide="cloud-rain" class="w-6 h-6 text-sky-500"></i>
                            <span class="font-medium text-slate-700 dark:text-slate-200 text-sm">雨の音</span>
                        </div>
                        <input id="noise-rain" data-sound="rain" type="range" class="sound-range w-24 accent-brand-500" min="0" max="100" value="30">
                    </div>
                    <div class="ambient-card bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <i data-lucide="coffee" class="w-6 h-6 text-amber-600"></i>
                            <span class="font-medium text-slate-700 dark:text-slate-200 text-sm">カフェの雑音</span>
                        </div>
                        <input id="noise-cafe" data-sound="cafe" type="range" class="sound-range w-24 accent-brand-500" min="0" max="100" value="0">
                    </div>
                    <div class="ambient-card bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <i data-lucide="waves" class="w-6 h-6 text-teal-500"></i>
                            <span class="font-medium text-slate-700 dark:text-slate-200 text-sm">波の音</span>
                        </div>
                        <input id="noise-wave" data-sound="wave" type="range" class="sound-range w-24 accent-brand-500" min="0" max="100" value="10">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl p-6 shadow-xl border border-slate-200 dark:border-slate-700 space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-brand-500"></i>
                    ポモドーロタイマー設定
                </h3>
                <button id="btn-close-settings" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">作業時間 (分)</label>
                    <input type="number" id="input-work-time" min="1" max="120" value="25" class="w-full px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">休憩時間 (分)</label>
                    <input type="number" id="input-break-time" min="1" max="60" value="5" class="w-full px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-settings" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl font-semibold text-sm transition shadow-sm">
                    設定を保存して反映
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
